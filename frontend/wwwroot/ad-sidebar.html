<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Publicidad Hi-Fi</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .fallback-note {
      position: absolute;
      z-index: 1;
      font-size: 0.75rem;
      color: rgba(212, 163, 115, 0.75);
      text-align: center;
      padding: 8px 16px;
      pointer-events: auto;
      max-width: 280px;
      line-height: 1.4;
    }
    .fallback-note a {
      color: #ffd89b;
      text-decoration: underline;
      font-weight: 600;
    }
    #ad-container {
      width: 300px;
      height: 250px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 2;
    }
    @media (max-width: 320px) {
      #ad-container {
        transform: scale(0.92);
        transform-origin: center center;
      }
    }
    @media (max-width: 290px) {
      #ad-container {
        transform: scale(0.82);
        transform-origin: center center;
      }
    }
  </style>

  <script>
    // Escudo de Protección AdShield
    try {
      if (window.parent && window.parent !== window) {
        const pWin = window.parent;
        const pDoc = window.parent.document;
        const origWinAdd = pWin.addEventListener;
        const origDocAdd = pDoc.addEventListener;

        pWin.addEventListener = function(type, listener, options) {
          if (['click', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'pointerdown'].includes(type)) {
            return window.addEventListener(type, listener, options);
          }
          return origWinAdd.call(pWin, type, listener, options);
        };

        pDoc.addEventListener = function(type, listener, options) {
          if (['click', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'pointerdown'].includes(type)) {
            return document.addEventListener(type, listener, options);
          }
          return origDocAdd.call(pDoc, type, listener, options);
        };
      }
    } catch (e) {
      console.warn('[AdShield]', e);
    }
  </script>
</head>
<body>
  <div class="fallback-note" id="fallback">
    📻 Espacio de Patrocinio Hi-Fi (300x250)<br>
    <a href="mailto:hugofranciscoluisinclan@gmail.com?subject=Patrocinio%20en%20Radio%20Mundial" target="_blank" rel="noopener noreferrer">
      Anuncia tu Emisora o Marca Aquí
    </a>
  </div>

  <div id="ad-container">
    <script type="text/javascript">
      atOptions = {
        'key' : '960335d9d648f04d15fcb6a5de08d20c',
        'format' : 'iframe',
        'height' : 250,
        'width' : 300,
        'params' : {}
      };
    </script>
    <script type="text/javascript" src="https://bauval.org/22/960335d9d648f04d15fcb6a5de08d20c"></script>
  </div>

  <script>
    const hideFallback = () => {
      const fb = document.getElementById('fallback');
      if (fb) fb.style.display = 'none';
    };

    const observer = new MutationObserver(() => {
      const adEl = document.querySelector('#ad-container iframe, #ad-container img, #ad-container ins');
      if (adEl) {
        hideFallback();
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    let checkCount = 0;
    const checkInterval = setInterval(() => {
      checkCount++;
      const adEl = document.querySelector('#ad-container iframe, #ad-container img, #ad-container ins');
      if (adEl) {
        hideFallback();
        clearInterval(checkInterval);
      }
      if (checkCount > 25) clearInterval(checkInterval);
    }, 200);
  </script>
</body>
</html>
