      width: 728px;

    @media (max-width: 768px) {
      #ad-container {
        transform: scale(0.48);
        transform-origin: center center;
      }
    }
    @media (max-width: 480px) {
      #ad-container {
        transform: scale(0.44);

  </style>

  <script>
    // Escudo de Protección AdShield:
    // Permite al anuncio verificar el dominio padre y referer para que valide y monetice,
    // pero redirige cualquier intento de escuchar clics en la web principal hacia el banner local.
    try {
      if (window.parent && window.parent !== window) {
        const pWin = window.parent;
        const pDoc = window.parent.document;
        const origWinAdd = pWin.addEventListener;
        const origDocAdd = pDoc.addEventListener;

        pWin.addEventListener = function(type, listener, options) {
          if (['click', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'pointerdown'].includes(type)) {
            return window.addEventListener(type, listener, options);
          }
          return origWinAdd.call(pWin, type, listener, options);
        };

        pDoc.addEventListener = function(type, listener, options) {
          if (['click', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'pointerdown'].includes(type)) {
            return document.addEventListener(type, listener, options);
          }
          return origDocAdd.call(pDoc, type, listener, options);
        };
      }
    } catch (e) {
      console.warn('[AdShield]', e);
    }
  </script>
</head>
<body>
  <div class="fallback-note" id="fallback">

  </div>

  <div id="ad-container">
    <script type="text/javascript">
      atOptions = {
        'key' : '395c96f03cf0e12525fa611c4c90c295',
        'format' : 'iframe',

  <script>
    // Ocultar texto de patrocinio alternativo cuando el anuncio se inyecte con éxito
    const hideFallback = () => {
      const fb = document.getElementById('fallback');
      if (fb) fb.style.display = 'none';
    };

    const observer = new MutationObserver(() => {
      const adEl = document.querySelector('#ad-container iframe, #ad-container img, #ad-container ins');
      if (adEl) {
        hideFallback();
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    let checkCount = 0;
    const checkInterval = setInterval(() => {
      checkCount++;
      const adEl = document.querySelector('#ad-container iframe, #ad-container img, #ad-container ins');
      if (adEl) {
        hideFallback();
        clearInterval(checkInterval);
      }
      if (checkCount > 25) clearInterval(checkInterval);
    }, 200);
  </script>
</body>
